body {
  font-family: 'Cairo', sans-serif;
  background: #f2f3f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: #ffffff;
  border-radius: 28px;
  padding: 52px 44px 44px;
  width: 100%;
  max-width: 440px;
  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 8px 32px rgba(0,0,0,0.08);
  text-align: center;
}

/* Logo */
.logo {
  width: 120px;
  height: auto;
  display: block;
  margin: 0 auto 36px;
  object-fit: contain;
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 20px;
  border-radius: 100px;
  font-size: .88rem;
  font-weight: 700;
  margin-bottom: 22px;
}

.badge.green  { background: #ecfdf5; color: #047857; }
.badge.yellow { background: #fffbeb; color: #b45309; }
.badge.red    { background: #fff1f2; color: #be123c; }
.badge.gray   { background: #f1f5f9; color: #475569; }

.badge-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.badge.green  .badge-dot { background: #10b981; animation: pulse 2s infinite; }
.badge.yellow .badge-dot { background: #f59e0b; animation: pulse 2s infinite; }
.badge.red    .badge-dot { background: #f43f5e; }
.badge.gray   .badge-dot { background: #94a3b8; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .3; }
}

/* Text */
.main-title {
  font-size: 1.35rem;
  font-weight: 900;
  color: #111827;
  margin-bottom: 10px;
  line-height: 1.4;
}

.main-desc {
  font-size: .88rem;
  color: #6b7280;
  line-height: 1.8;
  margin-bottom: 36px;
}

/* Divider */
.divider {
  border: none;
  border-top: 1px solid #f0f1f3;
  margin-bottom: 26px;
}

/* Contact */
.contact-label {
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: #c4c9d4;
  margin-bottom: 12px;
}

.contact-links {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.contact-link {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 16px;
  border-radius: 14px;
  background: #f7f8fa;
  text-decoration: none;
  color: #1f2937;
  font-weight: 600;
  font-size: .86rem;
  transition: background .15s;
  border: 1px solid #eeeff2;
}
.contact-link:hover { background: #eff0f3; }

/* Footer */
.footer {
  margin-top: 32px;
  font-size: .72rem;
  color: #d1d5db;
}
